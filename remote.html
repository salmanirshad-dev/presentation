<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1d">
<title>Presentation Remote</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #090d16;
    --card: #121826;
    --card-border: #1f293d;
    --text: #f1f5f9;
    --muted: #64748b;
    --blue: #2563eb;
    --blue-glow: rgba(37, 99, 235, 0.4);
    --green: #10b981;
    --red: #ef4444;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(16px, 4vw, 24px);
    touch-action: manipulation;
    overflow: hidden;
  }

  /* Header & Status */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--card-border);
  }
  .title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #eab308;
    transition: background 0.3s;
  }
  .status-badge.connected .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-badge.disconnected .dot { background: var(--red); }

  /* Slide Counter Card */
  .slide-info {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 16px;
    text-align: center;
    margin: 14px 0;
  }
  .slide-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .slide-numbers {
    font-size: 32px;
    font-weight: 850;
    letter-spacing: -0.04em;
    color: #fff;
  }
  .slide-progress {
    width: 100%;
    height: 6px;
    background: #1e293b;
    border-radius: 10px;
    margin-top: 12px;
    overflow: hidden;
  }
  .slide-progress-bar {
    height: 100%;
    width: 12.5%;
    background: var(--blue);
    border-radius: 10px;
    transition: width 0.25s ease;
  }

  /* Fullscreen Bar */
  .fs-btn {
    width: 100%;
    background: #172033;
    border: 1px solid #28354f;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 600;
    padding: 15px 20px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease;
    touch-action: manipulation;
  }
  .fs-btn:active, .fs-btn.pressed {
    background: #2563eb;
    color: #fff;
    transform: scale(0.96);
  }

  /* Main Nav Buttons */
  .nav-grid {
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 14px;
    flex: 1;
    margin: 14px 0;
    min-height: 220px;
  }
  .btn-action {
    border: none;
    border-radius: 24px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.08s ease;
    touch-action: manipulation;
  }
  .btn-prev {
    background: #182234;
    border: 1.5px solid #293852;
    color: #94a3b8;
  }
  .btn-prev:active, .btn-prev.pressed {
    transform: scale(0.95);
    background: #202c42;
    color: #fff;
  }
  .btn-next {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border: 1.5px solid #3b82f6;
    color: #ffffff;
    box-shadow: 0 8px 24px var(--blue-glow);
  }
  .btn-next:active, .btn-next.pressed {
    transform: scale(0.95);
    filter: brightness(1.2);
    box-shadow: 0 4px 12px var(--blue-glow);
  }
  .btn-sub {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.8;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(40px);
    background: rgba(30, 41, 59, 0.96);
    border: 1px solid #334155;
    color: #f8fafc;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 100px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
    z-index: 999;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* Room details */
  .footer-bar {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding-top: 8px;
  }
</style>
</head>
<body>

  <header class="header">
    <div class="title">
      <span>📱</span> Presenter Remote
    </div>
    <div class="status-badge" id="status-badge">
      <span class="dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </header>

  <div class="slide-info">
    <div class="slide-label">Smart Board Slide</div>
    <div class="slide-numbers"><span id="curr-slide">1</span> <span style="color:var(--muted);font-weight:400">/</span> <span id="total-slides">8</span></div>
    <div class="slide-progress">
      <div class="slide-progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <button class="fs-btn" id="btn-fullscreen" type="button">
    <span>⛶</span> Toggle Fullscreen on Screen
  </button>

  <div class="nav-grid">
    <button class="btn-action btn-prev" id="btn-prev" type="button">
      <span style="font-size:36px">‹</span>
      <span>Left</span>
      <span class="btn-sub">Previous</span>
    </button>
    <button class="btn-action btn-next" id="btn-next" type="button">
      <span style="font-size:36px">›</span>
      <span>Right</span>
      <span class="btn-sub">Next Slide</span>
    </button>
  </div>

  <div class="footer-bar">
    Room: <strong id="room-name" style="color:#94a3b8">...</strong> · Sub-40ms Supabase Realtime
  </div>

  <div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://ytyuucutzaqjjsqjviyq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_MMO2PmIOpVuNgBiXGn2rzQ_28pbPcJn';

  // Room pairing code from URL (e.g. ?room=ku07)
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room') || 'math07';
  document.getElementById('room-name').textContent = room;

  const statusBadge = document.getElementById('status-badge');
  const statusText = document.getElementById('status-text');
  const currSlideEl = document.getElementById('curr-slide');
  const totalSlidesEl = document.getElementById('total-slides');
  const progressBar = document.getElementById('progress-bar');
  const toastEl = document.getElementById('toast');

  let toastTimer = null;
  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
    }, 1400);
  }

  // Supabase Client
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    realtime: { params: { eventsPerSecond: 20 } }
  });

  const channel = client.channel(`presentation-${room}`, {
    config: { broadcast: { ack: false } }
  });

  function updateSlide(current, total) {
    currSlideEl.textContent = current;
    totalSlidesEl.textContent = total;
    const pct = (current / total) * 100;
    progressBar.style.width = pct + '%';
  }

  let isSubscribed = false;
  const pendingActions = [];

  // Listen for slide updates broadcast from the Smart Board
  channel
    .on('broadcast', { event: 'slide-state' }, ({ payload }) => {
      if (payload && payload.current && payload.total) {
        updateSlide(payload.current, payload.total);
      }
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        isSubscribed = true;
        statusBadge.className = 'status-badge connected';
        statusText.textContent = 'Connected';
        // Send any queued action
        while (pendingActions.length > 0) {
          const act = pendingActions.shift();
          rawSend(act);
        }
        sendAction('sync');
      } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
        isSubscribed = false;
        statusBadge.className = 'status-badge disconnected';
        statusText.textContent = 'Disconnected';
      }
    });

  function rawSend(action) {
    channel.send({
      type: 'broadcast',
      event: 'slide-action',
      payload: { action }
    });
  }

  function sendAction(action, toastMsg) {
    if (navigator.vibrate) {
      try { navigator.vibrate(25); } catch(e){}
    }
    if (toastMsg) showToast(toastMsg);

    if (!isSubscribed) {
      pendingActions.push(action);
      return;
    }
    rawSend(action);
  }

  // Universal fast-touch button binding
  function bindTouchButton(id, action, label) {
    const btn = document.getElementById(id);
    if (!btn) return;

    let fired = false;

    const fire = () => {
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 140);
      sendAction(action, label);
    };

    btn.addEventListener('touchstart', (e) => {
      fired = true;
      fire();
    }, { passive: true });

    btn.addEventListener('click', () => {
      if (fired) {
        fired = false;
        return;
      }
      fire();
    });
  }

  bindTouchButton('btn-prev', 'prev', '‹ Previous Slide');
  bindTouchButton('btn-next', 'next', 'Next Slide ›');
  bindTouchButton('btn-fullscreen', 'fullscreen', '⛶ Fullscreen sent to screen');
</script>
</body>
</html>
